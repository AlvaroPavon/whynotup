services:
  api:
    image: nginx:alpine
    environment:
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET before starting}
      DATABASE_URL: postgres://demo:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/demo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./missing-config.yaml
        target: /app/config.yaml
        bind:
          create_host_path: false
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 3
