# Deliberately defective local training project. Do not deploy it.
services:
  api:
    image: alpine:3.20
    command: ["sh", "-c", "sleep 3600"]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    depends_on:
      - db
    volumes:
      - type: bind
        source: ./missing-settings.ini
        target: /app/settings.ini
        read_only: true
        bind:
          create_host_path: false
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-only-not-a-real-secret
      POSTGRES_DB: demo
    ports:
      - "55432:5432"
