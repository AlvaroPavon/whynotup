[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whynotup"
version = "0.2.0"
description = "Local Docker Compose diagnostics and improvement rules, without AI or API quotas."
readme = "README.md"
requires-python = ">=3.10"
license = "zlib-acknowledgement"
license-files = ["LICENSE", "NOTICE", "licenses/MIT-0.1.0.txt"]
authors = [{name = "Álvaro Pavón"}]
dependencies = ["PyYAML>=6.0.1,<7"]
keywords = ["docker", "compose", "diagnostics", "devtools"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Environment :: Console"]

[project.scripts]
whynotup = "whynotup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whynotup = ["demo/*.yaml", "demo/*.env"]
