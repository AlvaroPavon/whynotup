[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whynotup"
version = "0.1.0"
description = "Evidence-based diagnostics for Docker Compose startup problems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Álvaro Pavón"}]
dependencies = ["PyYAML>=6.0.1,<7"]
keywords = ["docker", "compose", "diagnostics", "devtools"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Environment :: Console"]

[project.scripts]
whynotup = "whynotup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whynotup = ["demo/*.yaml", "demo/*.env"]
