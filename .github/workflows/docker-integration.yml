name: Docker integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WhyNotUp
        run: python -m pip install -e .
      - name: Check Docker and Compose
        run: |
          docker version
          docker compose version
          docker info
      - name: Run real Docker integration tests
        env:
          WHYNOTUP_DOCKER_TESTS: "1"
        run: python -m unittest discover -s tests/integration -p 'test_docker_*.py' -v
